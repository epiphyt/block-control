name: deployment
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: 8.0
          version: 2.2
      - name: Run PHP Code Sniffer
        run: vendor/bin/phpcs -s --standard=.phpcs.xml .
  phpunit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install Composer dependencies
      uses: php-actions/composer@v6
      with:
        php_version: 8.0
        version: 2.2
    - name: Run PHPUnit
      uses: php-actions/phpunit@v4
      with:
        configuration: phpunit.xml
        php_version: 8.0
  e2e:
    name: e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # the plugin loads vendor/autoload.php at runtime, so the production
      # dependencies have to be present in the mounted directory
      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          php_version: 8.0
          version: 2.2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      # without the build, build/blocks-manifest.php is missing and no blocks
      # are registered
      - name: npm build
        run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          PLAYGROUND_PHP: ${{ matrix.php }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-artifacts-php-${{ matrix.php }}
          path: |
            artifacts/
            playwright-report/
          retention-days: 7
  deploy-production:
    needs: [phpcs, phpunit, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: deploy production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          php_version: 8.0
          version: 2.2
      # Run npm build
      - uses: bahmutov/npm-install@v1
      - name: npm build
        run: npm run build
      # Deploy to wordpress.org
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      # Create artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}.zip
          path: ${{ github.event.repository.name }}.zip
      # Create release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}.zip
          name: Release ${{ github.ref_name }}
